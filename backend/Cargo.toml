[package]
name = "agent_fuel_backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Agent Fuel backend — Actix-Web indexer + REST/WS API for the reputation and credit-vault programs."
default-run = "agent_fuel_backend"

[[bin]]
name = "agent_fuel_backend"
path = "src/main.rs"

[dependencies]
actix-web = "4.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
subtle = "2"
actix-governor = "0.8"
actix-cors = "0.7"
actix-ws = "0.3"
futures-util = { version = "0.3", default-features = false }
async-trait = "0.1"
# Anchor-event decoding.
base64 = "0.22"
borsh = { version = "1", features = ["derive"] }
sha2 = { workspace = true }
bs58 = "0.5"
redis = { version = "0.27", default-features = false, features = [
    "tokio-rustls-comp",
    "connection-manager",
] }
# SIWS auth.
jsonwebtoken = "9"
ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
# On-demand chain backfill — fetches signatures + full transactions from RPC
# and replays them through the existing parser + mirror pipeline.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# Off-curve check for Solana PDA derivation (find_program_address). Already a
# transitive dep via ed25519-dalek; making it explicit so the backfill module's
# requirements are declared at the surface.
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
# Dev-only USDC airdrop endpoint: signs MintTo txs with a local mint authority
# keypair. Gated by AGENT_FUEL_USDC_MINT_AUTHORITY_PATH at startup — if the
# env var is unset the route is never registered, so prod images don't expose
# it even though the deps are linked.
solana-sdk = { workspace = true }
solana-client = "2.2"

[dev-dependencies]
actix-rt = "2"
ureq = { version = "2", features = ["json"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
