[workspace]
members = ["programs/*", "backend", "clients/runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/TODO/agent_fuel"
authors = ["Agent Fuel Contributors"]

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
solana-security-txt = "1.1.1"

# Test-only — referenced from program crates' [dev-dependencies].
litesvm = "0.7"
solana-sdk = "2.2"
# Used by program dev-deps for discriminator pins and by the backend at
# runtime for Anchor event-discriminator derivation.
sha2 = "0.10"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-idl", "no-log-ix-name"))',
] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
