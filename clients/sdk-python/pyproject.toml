[project]
name = "agent-fuel-sdk"
version = "0.2.0"
description = "Python SDK for Agent Fuel — credit vault + reputation primitives for AI agents on Solana."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Fuel" }]
requires-python = ">=3.10"
keywords = ["solana", "x402", "ai-agent", "credit-vault", "reputation", "anchor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "solders>=0.21",
    "httpx>=0.27",
    "websockets>=12",
    "construct>=2.10",
    "base58>=2.1",
]

[project.urls]
Homepage = "https://github.com/frankolien/agent_fuel/tree/main/clients/sdk-python#readme"
Repository = "https://github.com/frankolien/agent_fuel"
Issues = "https://github.com/frankolien/agent_fuel/issues"
Changelog = "https://github.com/frankolien/agent_fuel/blob/main/clients/sdk-python/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fuel"]

[tool.hatch.build.targets.wheel.shared-data]
"src/agent_fuel/idl/credit_vault.json" = "agent_fuel/idl/credit_vault.json"
"src/agent_fuel/idl/reputation.json" = "agent_fuel/idl/reputation.json"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
