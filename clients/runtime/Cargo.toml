[package]
name = "agent_fuel_runtime"
description = "Agent Fuel — reference agent runtime. Loads an Agent Fuel agent keypair and exercises the credit_vault `spend` instruction end-to-end on devnet/mainnet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
sha2 = { workspace = true }
solana-sdk = { workspace = true }
solana-client = "2.2"
spl-token = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
