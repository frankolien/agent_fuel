name: agent_fuel_mobile
description: Agent Fuel mobile console — vault + reputation management for AI agents on Solana.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  solana: ^0.31.0
  solana_mobile_client: ^0.1.2
  cryptography: ^2.7.0

  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  get_it: ^7.7.0
  auto_route: ^9.2.2

  dio: ^5.5.0
  web_socket_channel: ^2.4.0

  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  app_links: ^6.3.0

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  auto_route_generator: ^9.0.0

flutter:
  uses-material-design: true

# Launcher icons are legacy only — per-density PNGs copied straight from
# assets/agent-fuel-icons/icon-{48,72,96,144,192}.png into the matching
# mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}/ic_launcher.png. The brand
# mark already has its rounded-corner mask baked in, so on adaptive
# launchers the OS wraps it in its own silhouette — accepted trade-off.
