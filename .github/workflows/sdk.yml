name: SDK

on:
  push:
    branches: [main]
    paths:
      - "clients/sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "clients/sdk/**"
      - ".github/workflows/sdk.yml"

defaults:
  run:
    working-directory: clients/sdk

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
